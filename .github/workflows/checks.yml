name: Project checks

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-and-api:
    name: Database and HTTP / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Database constraints and transactions
        run: python -B -m unittest discover -s database/tests -v
      - name: Install API dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Authentication, authorization and paginated HTTP
        run: python -B -m unittest discover -s tests -v

  frontend:
    name: Frontend behavior / Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check frontend/src/http-api.js
          node --check frontend/src/app.js
      - name: HTTP adapter and asynchronous UI state
        run: |
          node frontend/tests/http-api.test.js
          node frontend/tests/app-state.test.js

  docker-smoke:
    name: Docker Compose startup and API smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and start the local demonstration container
        run: docker compose up --build -d
      - name: Verify health, expanded catalogue and bundled Swagger assets
        run: |
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8787/api/health
          python3 - <<'PY'
          import json
          from urllib.request import urlopen
          base = 'http://127.0.0.1:8787'
          def read(path):
              with urlopen(base + path, timeout=10) as response:
                  return json.load(response)
          assert read('/api/health')['data']['databaseVersion'] == 2
          assert read('/api/stores')['data']['total'] == 18
          assert read('/api/coupons')['data']['total'] == 18
          assert '/api/merchant/coupons/{coupon_id}/stock' in read('/openapi.json')['paths']
          with urlopen(base + '/docs-assets/swagger-ui-bundle.js', timeout=10) as response:
              assert response.headers.get_content_type() == 'text/javascript'
              assert len(response.read()) > 100000
          print('Container health, expanded demo and offline Swagger passed.')
          PY
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test containers
        if: always()
        run: docker compose down
